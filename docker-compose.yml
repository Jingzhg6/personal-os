# Local development database.
# Creates `personal_os` (dev) and `personal_os_test` (tests) on host port 5433.
services:
  db:
    image: postgres:16-alpine
    container_name: personal-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: personal_os
      POSTGRES_PASSWORD: personal_os
      POSTGRES_DB: personal_os
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_os -d personal_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
